name: airadar CI

# 테스트 전용. 스케줄/자동 포스팅 없음 (airadar 포스팅은 로컬에서만, dry_run 기본 true).
on:
  push:
    branches: [main]
    paths: ['airadar/**', '.github/workflows/airadar-ci.yml']
  pull_request:
    paths: ['airadar/**', '.github/workflows/airadar-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: airadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airadar/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q
